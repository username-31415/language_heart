<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Love Heart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #060208;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #060208;
        }

        #start-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: #060208;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

        .heart-btn {
            background: none;
            border: none;
            font-size: 80px;
            cursor: pointer;
            animation: pulse 1.5s infinite;
            filter: drop-shadow(0 0 20px rgba(230, 25, 40, 0.6));
            outline: none;
            padding: 20px;
        }

        .start-text {
            color: #ffb3b3;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(230, 25, 40, 0.4);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>

<body>

    <audio id="bg-audio" loop preload="auto">
        <source src="songg.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div id="canvas-container">
        <div id="start-overlay" onclick="startAnimation()">
            <button class="heart-btn" aria-label="Open the heart">❤️</button>
            <div class="start-text">Click to Open</div>
        </div>

        <canvas id="heartCanvas"></canvas>
    </div>

<script>
const canvas = document.getElementById('heartCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('start-overlay');
const audio = document.getElementById('bg-audio');

const VIRTUAL_WIDTH = 800;
const VIRTUAL_HEIGHT = 800;

// Animation timing
const DURATION = 30; 
const TICK = 16;
const ANIM = 42;
const LIFT = 34;

// Leave time for the final words to finish appearing
// before the 30-second deadline.
const SPAWN_DURATION = DURATION * 1000 - ANIM * TICK - 500;

let viewportWidth = window.innerWidth;
let viewportHeight = window.innerHeight;
let pixelRatio = 1;

function resizeCanvas() {
    const width = window.visualViewport
        ? window.visualViewport.width
        : window.innerWidth;

    const height = window.visualViewport
        ? window.visualViewport.height
        : window.innerHeight;

    viewportWidth = width;
    viewportHeight = height;

    // High-resolution rendering for sharper text on phones.
    pixelRatio = Math.min(window.devicePixelRatio || 1, 3);

    canvas.width = Math.round(width * pixelRatio);
    canvas.height = Math.round(height * pixelRatio);

    // Draw in CSS pixels while rendering at device resolution.
    ctx.setTransform(
        pixelRatio, 0,
        0, pixelRatio,
        0, 0
    );
}

window.addEventListener('resize', () => {
    resizeCanvas();
    render();
});

if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
        resizeCanvas();
        render();
    });
}

const SC = 21;
const OY = 20;
const GAP = 7;
const SIZES = [9, 10, 11, 12];
const FONT = "Arial, sans-serif";
const BG = "#060208";
const BGC = [6/255, 2/255, 8/255];

// Requested languages only
const PHRASES = [
    "I love you",                         // English
    "میں تم سے محبت کرتا ہوں",             // Urdu
    "Te amo",                             // Spanish
    "زه له تا سره مینه لرم",               // Pashto
    "أحبك",                               // Arabic
    "ਮੈਂ ਤੈਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ",              // Punjabi
    "Je t'aime",                          // French
    "मैं तुमसे प्यार करता हूँ",              // Hindi
    "Eu te amo",                          // Portuguese
    "Я тебя люблю",                       // Russian
    "Ik hou van jou",                     // Dutch
    "Ich liebe dich",                     // German
    "ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ",           // Kannada
    "دوستت دارم",                         // Farsi
    "मी तुझ्यावर प्रेम करतो",                // Marathi
    "আমি তোমাকে ভালোবাসি"                  // Bengali
];

const rng = (function() {
    let seed = 11;

    return {
        random() {
            seed = (seed * 9301 + 49297) % 233280;
            return seed / 233280;
        },

        uniform(min, max) {
            return min + this.random() * (max - min);
        },

        choice(arr) {
            return arr[Math.floor(this.random() * arr.length)];
        },

        shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(this.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }

            return arr;
        }
    };
})();

function heart(a) {
    const x = 16 * (Math.sin(a) ** 3);

    const y =
        13 * Math.cos(a)
        - 5 * Math.cos(2 * a)
        - 2 * Math.cos(3 * a)
        - Math.cos(4 * a);

    return [x * SC, y * SC + OY];
}

function hx(c) {
    const r = Math.floor(Math.max(0, Math.min(1, c[0])) * 255);
    const g = Math.floor(Math.max(0, Math.min(1, c[1])) * 255);
    const b = Math.floor(Math.max(0, Math.min(1, c[2])) * 255);

    return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
}

function mix(a, b, k) {
    return [
        a[0] + (b[0] - a[0]) * k,
        a[1] + (b[1] - a[1]) * k,
        a[2] + (b[2] - a[2]) * k
    ];
}

function dim(c, k) {
    return [c[0] * k, c[1] * k, c[2] * k];
}

const POLY = [];

for (let i = 0; i < 720; i++) {
    POLY.push(heart(2 * Math.PI * i / 720));
}

const EDGES = [];

for (let i = 0; i < POLY.length; i++) {
    EDGES.push([POLY[i], POLY[(i + 1) % POLY.length]]);
}

const YMAX = Math.max(...POLY.map(p => p[1]));
const YMIN = Math.min(...POLY.map(p => p[1]));
const CY = (YMAX + YMIN) / 2;

function getLineHeight(size) {
    return size * 1.3 + 4;
}

function measureText(text, size) {
    ctx.font = `bold ${size}px ${FONT}`;
    return ctx.measureText(text).width;
}

function spans(y) {
    const xs = [];

    for (const [p1, p2] of EDGES) {
        const [x1, y1] = p1;
        const [x2, y2] = p2;

        if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
            xs.push(x1 + (y - y1) * (x2 - x1) / (y2 - y1));
        }
    }

    xs.sort((a, b) => a - b);

    const pairs = [];

    for (let i = 0; i < xs.length; i += 2) {
        if (i + 1 < xs.length) {
            pairs.push([xs[i], xs[i + 1]]);
        }
    }

    return pairs;
}

function intersect(A, B) {
    const out = [];

    for (const a of A) {
        for (const b of B) {
            const lo = Math.max(a[0], b[0]);
            const hi = Math.min(a[1], b[1]);

            if (hi - lo > 14) {
                out.push([lo, hi]);
            }
        }
    }

    return out;
}

function* phraseCycle() {
    while (true) {
        const order = [...PHRASES];
        rng.shuffle(order);
        yield* order;
    }
}

function math_dist(x, y) {
    return Math.hypot(
        x / (16 * SC),
        (y - CY) / (14.5 * SC)
    );
}

let ORDER = [];
let main_ids = [];
let active = [];
let currentIndex = 0;
let RATE = 0;
let acc = 0;
let spawning = false;
let animationStarted = false;
let loopTimer = null;
let runId = 0;

function build() {
    const cycle = phraseCycle();

    const row_h = Math.max(
        ...SIZES.map(z => getLineHeight(z))
    ) + 4;

    const half = row_h / 2;
    const placed = [];

    let y = YMAX - half;

    while (y > YMIN + half) {
        const row = intersect(
            spans(y + half),
            spans(y - half)
        );

        for (let [lo, hi] of row) {
            lo += 4;
            hi -= 4;

            let cur = lo + rng.uniform(0, 8);
            const line = [];

            while (true) {
                let fit = null;

                for (let i = 0; i < 10; i++) {
                    const text = cycle.next().value;
                    const size = rng.choice(SIZES);
                    const w = measureText(text, size);

                    if (cur + w <= hi) {
                        fit = [text, size, w];
                        break;
                    }
                }

                if (!fit) break;

                const [text, size, w] = fit;

                line.push([cur + w / 2, text, size, w]);
                cur += w + GAP;
            }

            if (line.length === 0) continue;

            if (line.length > 1) {
                const left = hi -
                    (line[line.length - 1][0] +
                     line[line.length - 1][3] / 2);

                for (let i = 0; i < line.length; i++) {
                    line[i][0] += left * i / (line.length - 1);
                }
            } else {
                line[0][0] = (lo + hi) / 2;
            }

            for (let i = 0; i < line.length; i++) {
                const [x, text, size] = line[i];

                placed.push({
                    x,
                    y,
                    text,
                    size,
                    edge: i === 0 || i === line.length - 1
                });
            }
        }

        y -= row_h;
    }

    const wine = [0.58, 0.0, 0.09];
    const crimson = [0.90, 0.05, 0.14];
    const blood = [0.98, 0.10, 0.16];

    for (const p of placed) {
        const rad = Math.min(1.0, math_dist(p.x, p.y));

        let base = mix(wine, crimson, 0.25 + 0.75 * rad);

        base = mix(
            base,
            blood,
            rng.uniform(0, 0.35) + (p.edge ? 0.3 : 0)
        );

        p.color = [
            Math.min(1, base[0]),
            Math.min(1, base[1]),
            Math.min(1, base[2])
        ];

        p.rad = rad;
    }

    const edges = placed.filter(p => p.edge);
    const inner = placed.filter(p => !p.edge);

    edges.sort((a, b) =>
        (Math.atan2(a.x, a.y - CY) % (2 * Math.PI)) -
        (Math.atan2(b.x, b.y - CY) % (2 * Math.PI))
    );

    inner.sort((a, b) =>
        (-b.rad + rng.uniform(0, 0.08)) -
        (-a.rad + rng.uniform(0, 0.08))
    );

    return [...edges, ...inner];
}

const FLASH = [1.0, 0.78, 0.78];

function clamp(v) {
    return Math.max(0, Math.min(1, v));
}

function spawn(p) {
    p.f = 0;
    p.dx = rng.uniform(-10, 10);

    main_ids.push(p);
    active.push(p);
}

function animate(p) {
    p.f += 1;

    const u = clamp(p.f / ANIM);
    const e = 1 - (1 - u) ** 3;

    const c = p.color;
    const x = p.x;
    const y = -p.y;

    const hover = (1 - e) * LIFT;

    p.currentX = x + p.dx * (1 - e);
    p.currentY = y - hover;

    const flash = 0.75 *
        Math.sin(Math.PI * clamp((u - 0.55) / 0.45));

    const col = mix(mix(BGC, c, e ** 1.5), FLASH, flash);

    p.currentMainFill = hx(col);
    p.currentShadowFill = hx(mix(BGC, dim(c, 0.30), e));
    p.currentHaloFill = hx(mix(BGC, dim(c, 0.20), e * e));

    if (u >= 1) {
        p.currentX = x;
        p.currentY = y;
        p.currentMainFill = hx(c);
        return false;
    }

    return true;
}

function startAnimation() {
    if (animationStarted) return;

    animationStarted = true;
    resizeCanvas();

    audio.currentTime = 0;

    audio.play().catch(err => {
        console.log("Audio play error:", err);
    });

    overlay.style.opacity = '0';

    setTimeout(() => {
        overlay.style.display = 'none';
    }, 800);

    initLoop();
}

function initLoop() {
    if (loopTimer !== null) {
        clearTimeout(loopTimer);
        loopTimer = null;
    }

    runId++;

    main_ids = [];
    active = [];
    ORDER = build();

    currentIndex = 0;
    RATE = ORDER.length / (SPAWN_DURATION / TICK);
    acc = 0;
    spawning = true;

    step(runId);
}

function step(id) {
    if (id !== runId) return;

    if (spawning) {
        acc += RATE;

        while (acc >= 1 && currentIndex < ORDER.length) {
            acc -= 1;
            spawn(ORDER[currentIndex]);
            currentIndex++;
        }

        if (currentIndex >= ORDER.length) {
            spawning = false;
        }
    }

    active = active.filter(p => animate(p));

    render();

    if (!spawning && active.length === 0) {
        // Wait briefly, then repeat the same animation.
        loopTimer = setTimeout(() => {
            if (id === runId) {
                initLoop();
            }
        }, 1000);

        return;
    }

    loopTimer = setTimeout(() => step(id), TICK);
}

function render() {
    // Clear using CSS pixel dimensions; the context itself
    // is scaled to the screen's device pixel ratio.
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, viewportWidth, viewportHeight);

    ctx.save();

    // Fit the heart to the screen and center it.
    const scaleX = viewportWidth / VIRTUAL_WIDTH;
    const scaleY = viewportHeight / VIRTUAL_HEIGHT;
    const scale = Math.min(scaleX, scaleY);

    ctx.translate(viewportWidth / 2, viewportHeight / 2);
    ctx.scale(scale, scale);

    // Center the heart's actual vertical bounds.
    ctx.translate(0, CY);

    for (const p of main_ids) {
        const x = p.currentX !== undefined
            ? p.currentX
            : p.x;

        const y = p.currentY !== undefined
            ? p.currentY
            : (-p.y);

        const size = p.size;
        const text = p.text;

        // Explicit text settings for consistent, sharp rendering.
        ctx.font = `bold ${size}px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        if (p.currentShadowFill && p.f < ANIM) {
            ctx.fillStyle = p.currentShadowFill;
            ctx.fillText(text, x + 2, y + 3);
        } else {
            ctx.fillStyle = BG;
            ctx.fillText(text, x + 2, y + 3);
        }

        if (p.currentHaloFill && p.f < ANIM) {
            ctx.font = `bold ${size + 1}px ${FONT}`;
            ctx.fillStyle = p.currentHaloFill;
            ctx.fillText(text, x, y);
        }

        ctx.fillStyle = p.currentMainFill || hx(p.color);

        const drawY = p.f < ANIM
            ? y - LIFT
            : y;

        ctx.fillText(text, x, drawY);
    }

    ctx.restore();
}

// Initial canvas setup.
resizeCanvas();
render();

</script>

</body>
</html>
