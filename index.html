<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060208">
  <title>My Heart for You ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #060208;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #060208;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      background: rgba(6, 2, 8, 0.94);
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .heart-icon {
      font-size: clamp(52px, 12vw, 90px);
      line-height: 1;
      animation: heartbeat 1.3s infinite;
      filter: drop-shadow(0 0 20px rgba(255, 55, 115, 0.65));
    }

    #start-button {
      padding: 14px 30px;
      border: 1px solid rgba(255, 145, 180, 0.8);
      border-radius: 50px;
      background: linear-gradient(135deg, #ff3269, #c21d69);
      color: white;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 0 28px rgba(255, 45, 105, 0.3);
      -webkit-tap-highlight-color: transparent;
    }

    #start-button:active {
      transform: scale(0.96);
    }

    .subtitle {
      max-width: 300px;
      color: #e8cbd6;
      font-size: 14px;
      text-align: center;
      line-height: 1.6;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.12); }
      30% { transform: scale(1); }
      45% { transform: scale(1.08); }
      60% { transform: scale(1); }
    }

    @media (max-width: 480px) {
      #start-button {
        padding: 13px 25px;
        font-size: 15px;
      }

      .subtitle {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart-icon {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="canvas-container">
    <canvas id="heart-canvas"></canvas>
  </div>

  <div id="overlay">
    <div class="heart-icon">❤️</div>
    <button id="start-button" type="button">Open My Heart ❤️</button>
    <div class="subtitle">
      A little message from my heart, in 16 languages.
    </div>
  </div>

  <audio id="bg-audio" loop preload="auto">
    <source src="songg.mp3" type="audio/mpeg">
  </audio>

  <script>
    (() => {
      "use strict";

      // ==========================================
      // TIMING
      // Build: 28 seconds
      // Hold:  2 seconds
      // Loop:  30 seconds
      // ==========================================

      const LOOP_DURATION = 30000;
      const BUILD_DURATION = 28000;
      const ANIM = 42;
      const TICK = 16;
      const ANIM_MS = ANIM * TICK;
      const SPAWN_DURATION = BUILD_DURATION - ANIM_MS;

      // ==========================================
      // CANVAS AND DESIGN
      // ==========================================

      const VIRTUAL_WIDTH = 800;
      const VIRTUAL_HEIGHT = 800;
      const SC = 21;
      const OY = 20;
      const LIFT = 34;
      const GAP = 7;
      const SIZES = [9, 10, 11, 12];
      const FONT = "Arial, Helvetica, sans-serif";
      const BGC = "#060208";
      const FLASH = "#fff0f5";

      const canvas = document.getElementById("heart-canvas");
      const ctx = canvas.getContext("2d", { alpha: false });
      const overlay = document.getElementById("overlay");
      const startButton = document.getElementById("start-button");
      const audio = document.getElementById("bg-audio");

      let viewWidth = 0;
      let viewHeight = 0;
      let pixelRatio = 1;
      let viewScale = 1;
      let offsetX = 0;
      let offsetY = 0;

      let ORDER = [];
      let main_ids = [];
      let active = [];
      let currentIndex = 0;
      let loopStart = 0;
      let running = false;
      let animationFrame = null;

      // ==========================================
      // MESSAGES IN THE 16 REQUESTED LANGUAGES
      // ==========================================

      const PHRASES = [
        "I LOVE YOU",
        "میں تم سے محبت کرتا ہوں",
        "TE AMO",
        "زه له تا سره مینه لرم",
        "أحبك",
        "ਮੈਂ ਤੈਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ",
        "JE T'AIME",
        "मैं तुमसे प्यार करता हूँ",
        "EU TE AMO",
        "Я ТЕБЯ ЛЮБЛЮ",
        "IK HOU VAN JOU",
        "ICH LIEBE DICH",
        "ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ",
        "دوستت دارم",
        "माझं तुझ्यावर प्रेम आहे",
        "আমি তোমাকে ভালোবাসি"
      ];

      const COLORS = [
        "#ff5c8a",
        "#ff739e",
        "#ff8fab",
        "#ffb3c7",
        "#f65d91",
        "#f48fb1",
        "#ff4d79",
        "#ff9fbd",
        "#ff6b6b",
        "#ff80ab",
        "#e86aa7",
        "#ffb6c9"
      ];

      // ==========================================
      // HELPERS
      // ==========================================

      const clamp = value => Math.max(0, Math.min(1, value));

      function random(min, max) {
        return Math.random() * (max - min) + min;
      }

      function pick(array) {
        return array[Math.floor(Math.random() * array.length)];
      }

      function hexToRgb(hex) {
        const value = hex.replace("#", "");
        return {
          r: parseInt(value.slice(0, 2), 16),
          g: parseInt(value.slice(2, 4), 16),
          b: parseInt(value.slice(4, 6), 16)
        };
      }

      function rgbToHex({ r, g, b }) {
        const toHex = value =>
          Math.round(Math.max(0, Math.min(255, value)))
            .toString(16)
            .padStart(2, "0");

        return "#" + toHex(r) + toHex(g) + toHex(b);
      }

      function mix(colorA, colorB, amount) {
        const a = hexToRgb(colorA);
        const b = hexToRgb(colorB);
        const t = clamp(amount);

        return {
          r: a.r + (b.r - a.r) * t,
          g: a.g + (b.g - a.g) * t,
          b: a.b + (b.b - a.b) * t
        };
      }

      function dim(color, amount) {
        const rgb = hexToRgb(color);

        return rgbToHex({
          r: rgb.r * amount,
          g: rgb.g * amount,
          b: rgb.b * amount
        });
      }

      function hx(rgb) {
        return rgbToHex(rgb);
      }

      // ==========================================
      // HEART SHAPE
      // ==========================================

      function heart(t) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y =
          13 * Math.cos(t) -
          5 * Math.cos(2 * t) -
          2 * Math.cos(3 * t) -
          Math.cos(4 * t);

        return { x, y };
      }

      function heartBoundary() {
        const points = [];

        for (let i = 0; i <= 300; i++) {
          const t = (i / 300) * Math.PI * 2;
          const p = heart(t);

          points.push({
            x: 400 + p.x * SC,
            y: 400 - p.y * SC + OY
          });
        }

        return points;
      }

      const boundary = heartBoundary();

      // Find horizontal intersections with the heart boundary.
      function horizontalIntersections(y) {
        const intersections = [];

        for (let i = 0; i < boundary.length - 1; i++) {
          const a = boundary[i];
          const b = boundary[i + 1];

          if ((a.y <= y && b.y > y) ||
              (b.y <= y && a.y > y)) {
            const t = (y - a.y) / (b.y - a.y);
            intersections.push(a.x + t * (b.x - a.x));
          }
        }

        intersections.sort((a, b) => a - b);
        return intersections;
      }

      // ==========================================
      // BUILD THE WORDS INSIDE THE HEART
      // ==========================================

      function build() {
        const particles = [];
        let phraseIndex = 0;

        const top = 400 - 17 * SC + OY;
        const bottom = 400 + 15 * SC + OY;
        const rowGap = 15;

        for (let y = top; y <= bottom; y += rowGap) {
          const intersections = horizontalIntersections(y);

          for (let i = 0; i + 1 < intersections.length; i += 2) {
            const left = intersections[i] + 5;
            const right = intersections[i + 1] - 5;
            const availableWidth = right - left;

            if (availableWidth < 18) continue;

            let x = left;

            while (x < right) {
              const phrase = PHRASES[phraseIndex % PHRASES.length];
              phraseIndex++;

              const size = pick(SIZES);

              ctx.save();
              ctx.font = `600 ${size}px ${FONT}`;
              const measuredWidth = ctx.measureText(phrase).width;
              ctx.restore();

              // Keep long phrases inside the heart.
              const maxWidth = Math.max(12, right - x);

              let displayPhrase = phrase;
              let displaySize = size;

              if (measuredWidth > maxWidth) {
                displaySize = Math.max(7, size * maxWidth / measuredWidth);
              }

              const actualWidth = Math.min(
                measuredWidth,
                maxWidth
              );

              particles.push({
                x: x + actualWidth / 2,
                y: y + random(-1.5, 1.5),
                text: displayPhrase,
                size: displaySize,
                color: pick(COLORS),
                dx: 0,
                f: 0,
                startTime: 0,
                currentX: x + actualWidth / 2,
                currentY: y,
                currentMainFill: BGC,
                currentShadowFill: BGC,
                currentHaloFill: BGC
              });

              x += Math.max(14, actualWidth + GAP);
            }
          }
        }

        // Randomize the reveal order so the heart builds organically.
        for (let i = particles.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [particles[i], particles[j]] = [particles[j], particles[i]];
        }

        return particles;
      }

      // ==========================================
      // RESPONSIVE CANVAS
      // ==========================================

      function resizeCanvas() {
        viewWidth = window.innerWidth;
        viewHeight = window.innerHeight;
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(viewWidth * pixelRatio);
        canvas.height = Math.round(viewHeight * pixelRatio);

        canvas.style.width = viewWidth + "px";
        canvas.style.height = viewHeight + "px";

        // Keep the entire heart visible on mobile and desktop.
        const padding = viewWidth < 480 ? 16 : 30;

        viewScale = Math.min(
          (viewWidth - padding * 2) / VIRTUAL_WIDTH,
          (viewHeight - padding * 2) / VIRTUAL_HEIGHT
        );

        offsetX = (viewWidth - VIRTUAL_WIDTH * viewScale) / 2;
        offsetY = (viewHeight - VIRTUAL_HEIGHT * viewScale) / 2;

        render();
      }

      // ==========================================
      // SPAWN AND ANIMATE
      // ==========================================

      function spawn(p, scheduledTime) {
        p.f = 0;
        p.dx = random(-10, 10);
        p.startTime = scheduledTime;

        main_ids.push(p);
        active.push(p);
      }

      function animate(p, now) {
        const elapsed = now - p.startTime;
        const u = clamp(elapsed / ANIM_MS);
        const eased = 1 - Math.pow(1 - u, 3);

        p.f = u * ANIM;

        const color = p.color;
        const x = p.x;
        const y = p.y;

        const hover = (1 - eased) * LIFT;

        p.currentX = x + p.dx * (1 - eased);
        p.currentY = y - hover;

        const flash =
          0.75 * Math.sin(Math.PI * clamp((u - 0.55) / 0.45));

        const mainColor = mix(BGC, color, Math.pow(eased, 1.5));
        const flashedColor = mix(
          hx(mainColor),
          FLASH,
          flash
        );

        p.currentMainFill = hx(flashedColor);
        p.currentShadowFill = hx(mix(BGC, dim(color, 0.30), eased));
        p.currentHaloFill = hx(mix(BGC, dim(color, 0.20), eased * eased));

        if (u >= 1) {
          p.currentX = x;
          p.currentY = y;
          p.currentMainFill = color;
          p.f = ANIM;
          return false;
        }

        return true;
      }

      // ==========================================
      // DRAW
      // ==========================================

      function render() {
        if (!ctx || !viewWidth || !viewHeight) return;

        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        ctx.fillStyle = BGC;
        ctx.fillRect(0, 0, viewWidth, viewHeight);

        ctx.save();

        ctx.translate(offsetX, offsetY);
        ctx.scale(viewScale, viewScale);

        // Gentle ambient glow behind the heart.
        const glow = ctx.createRadialGradient(
          400, 400, 30,
          400, 400, 350
        );

        glow.addColorStop(0, "rgba(130, 15, 55, 0.12)");
        glow.addColorStop(1, "rgba(6, 2, 8, 0)");

        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

        for (const p of main_ids) {
          const isComplete = p.f >= ANIM;
          const px = p.currentX;
          const py = p.currentY;

          ctx.save();
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.direction = "auto";
          ctx.font = `600 ${p.size}px ${FONT}`;

          // Soft shadow improves readability.
          ctx.shadowColor = isComplete
            ? p.currentHaloFill
            : "rgba(255, 70, 125, 0.16)";

          ctx.shadowBlur = isComplete ? 4 : 2;
          ctx.fillStyle = p.currentShadowFill;
          ctx.fillText(p.text, px + 0.5, py + 0.7);

          ctx.shadowBlur = isComplete ? 3 : 0;
          ctx.fillStyle = p.currentMainFill;
          ctx.fillText(p.text, px, py);

          ctx.restore();
        }

        ctx.restore();
      }

      // ==========================================
      // EXACT 30-SECOND LOOP
      // ==========================================

      function initLoop(now) {
        main_ids = [];
        active = [];
        ORDER = build();
        currentIndex = 0;
        loopStart = now;
      }

      function step(now) {
        if (!running) return;

        let elapsed = now - loopStart;

        // Restart precisely at the 30-second boundary.
        if (elapsed >= LOOP_DURATION) {
          initLoop(loopStart + LOOP_DURATION);
          elapsed = now - loopStart;
        }

        // Spread scheduled arrivals across the build window.
        const targetCount = Math.min(
          ORDER.length,
          Math.floor((elapsed / SPAWN_DURATION) * ORDER.length)
        );

        while (currentIndex < targetCount) {
          const scheduledTime =
            loopStart +
            (currentIndex / ORDER.length) * SPAWN_DURATION;

          spawn(ORDER[currentIndex], scheduledTime);
          currentIndex++;
        }

        // Ensure every phrase has been scheduled before the build deadline.
        if (elapsed >= SPAWN_DURATION) {
          while (currentIndex < ORDER.length) {
            const scheduledTime =
              loopStart +
              (currentIndex / ORDER.length) * SPAWN_DURATION;

            spawn(ORDER[currentIndex], scheduledTime);
            currentIndex++;
          }
        }

        active = active.filter(p => animate(p, now));

        render();
        animationFrame = requestAnimationFrame(step);
      }

      // ==========================================
      // START BUTTON AND MUSIC
      // ==========================================

      async function startAnimation() {
        if (running) return;

        running = true;
        overlay.classList.add("hidden");

        // Start the music from the beginning on each fresh start.
        audio.currentTime = 0;

        try {
          await audio.play();
        } catch (error) {
          // Some browsers may block audio; the animation still runs.
          console.warn("Audio playback could not start:", error);
        }

        const now = performance.now();
        initLoop(now);

        if (animationFrame !== null) {
          cancelAnimationFrame(animationFrame);
        }

        animationFrame = requestAnimationFrame(step);
      }

      startButton.addEventListener("click", startAnimation);

      window.addEventListener("resize", resizeCanvas);

      // Initial setup.
      resizeCanvas();
    })();
  </script>
</body>
</html>
