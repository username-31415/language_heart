<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multilingual Love Heart ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #080814;
            color: #ff4d6d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(8, 8, 20, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
            text-align: center;
        }

        #overlay h1 {
            font-size: 2.2rem;
            color: #ff758f;
            margin-bottom: 12px;
            text-shadow: 0 0 15px rgba(255, 117, 143, 0.7);
            animation: pulseTap 1.5s infinite;
        }

        #overlay p {
            color: #d1d5db;
            font-size: 1.1rem;
        }

        @keyframes pulseTap {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.06); opacity: 1; text-shadow: 0 0 25px rgba(255, 77, 109, 0.9); }
            100% { transform: scale(1); opacity: 0.9; }
        }

        /* Container with continuous heartbeat pulsing */
        .heart-container {
            position: relative;
            width: 90vw;
            max-width: 650px;
            height: 90vh;
            max-height: 650px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: heartbeat 2.5s ease-in-out infinite alternate;
        }

        @keyframes heartbeat {
            0% { transform: scale(0.98); }
            50% { transform: scale(1.03); }
            100% { transform: scale(0.98); }
        }

        .message {
            position: absolute;
            font-weight: 600;
            white-space: nowrap;
            text-shadow: 0 0 12px rgba(255, 77, 109, 0.6);
            animation: floatGlow 4s ease-in-out infinite alternate;
            transform: translate(-50%, -50%);
        }

        /* Continuous floating animation loop */
        @keyframes floatGlow {
            0% {
                opacity: 0.3;
                transform: translate(-50%, -50%) translateY(4px) scale(0.95);
                text-shadow: 0 0 6px rgba(255, 77, 109, 0.4);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) translateY(-4px) scale(1.05);
                text-shadow: 0 0 18px rgba(255, 117, 143, 0.9);
            }
            100% {
                opacity: 0.6;
                transform: translate(-50%, -50%) translateY(2px) scale(1);
                text-shadow: 0 0 10px rgba(255, 77, 109, 0.6);
            }
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startExperience()">
        <h1>Tap to Open ❤️</h1>
        <p>🔊 Turn sound on</p>
    </div>

    <audio id="bg-song" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="heart-container" id="heart"></div>

    <script>
        const loveTranslations = [
            "I Love You",                // 1. English
            "میں آپ سے محبت کرتی ہوں",     // 2. Urdu
            "زه له تا سره مینه لرم",       // 3. Pashto
            "أنا أحبك",                 // 4. Arabic
            "میں تہانوں پیار کردی آں",      // 5. Punjabi
            "Te amo",                    // 6. Spanish
            "Je t'aime",                 // 7. French
            "मैं आपसे प्यार करती हूँ",     // 8. Hindi
            "Eu te amo",                 // 9. Portuguese
            "Я тебя люблю",              // 10. Russian
            "Ik hou van je",             // 11. Dutch
            "Ich liebe dich",            // 12. German
            "ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ", // 13. Kannada
            "دوستت دارم",                // 14. Farsi
            "माझे तुझ्यावर प्रेम आहे",   // 15. Marathi
            "আমি তোমায় ভালোবাসি",        // 16. Bengali
            "Seni seviyorum",            // 17. Turkish
            "我爱你",                    // 18. Chinese
            "사랑해",                   // 19. Korean
            "אני אוהבת אותך"             // 20. Hebrew
        ];

        function startExperience() {
            document.getElementById('overlay').style.display = 'none';
            const audio = document.getElementById('bg-song');
            
            // Play song
            audio.play().catch(e => {
                console.log("Audio file 'song.mp3' not found or blocked:", e);
            });
            
            renderHeart();
        }

        function renderHeart() {
            const container = document.getElementById('heart');
            const total = loveTranslations.length;
            const containerWidth = container.clientWidth;
            const radius = Math.min(containerWidth * 0.42, 240);

            loveTranslations.forEach((text, i) => {
                const span = document.createElement('span');
                span.className = 'message';
                span.innerText = text;

                // Heart parametric mathematical distribution
                const t = (i / total) * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                // Scale and center points
                const posX = (x / 16) * radius;
                const posY = (y / 16) * radius;

                span.style.left = `calc(50% + ${posX}px)`;
                span.style.top = `calc(50% + ${posY}px)`;

                // Adjust font size based on text length to prevent overlap
                if (text.length > 18) {
                    span.style.fontSize = "11px";
                } else if (text.length > 10) {
                    span.style.fontSize = "13px";
                } else {
                    span.style.fontSize = "15px";
                }

                // Staggered continuous animation delays
                span.style.animationDelay = `${(i * 0.2).toFixed(2)}s`;

                container.appendChild(span);
            });
        }
    </script>
</body>
</html>
