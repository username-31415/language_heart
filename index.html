<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multilingual Love Heart ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #080814;
            color: #ff4d6d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(8, 8, 20, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
            text-align: center;
        }

        #overlay h1 {
            font-size: 2.2rem;
            color: #ff758f;
            margin-bottom: 12px;
            text-shadow: 0 0 15px rgba(255, 117, 143, 0.7);
            animation: pulseTap 1.5s infinite;
        }

        #overlay p {
            color: #d1d5db;
            font-size: 1.1rem;
        }

        @keyframes pulseTap {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.06); opacity: 1; text-shadow: 0 0 25px rgba(255, 77, 109, 0.9); }
            100% { transform: scale(1); opacity: 0.9; }
        }

        .heart-container {
            position: relative;
            width: 90vw;
            max-width: 750px;
            height: 90vh;
            max-height: 750px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Shifted upward so the bottom tip is clearly visible */
            transform: translateY(-25px);
        }

        .message {
            position: absolute;
            font-weight: 600;
            white-space: nowrap;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.3);
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 0 14px rgba(255, 77, 109, 0.7);
        }

        .message.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

    <!-- Tap to Open overlay to handle browser audio permissions -->
    <div id="overlay" onclick="startExperience()">
        <h1>Tap to Open ❤️</h1>
        <p>🔊 Turn sound on</p>
    </div>

    <!-- Audio element pointing to songg.mp3 -->
    <audio id="bg-song" loop preload="auto">
        <source src="songg.mp3" type="audio/mpeg">
    </audio>

    <div class="heart-container" id="heart"></div>

    <script>
        const loveTranslations = [
            "I Love You",                // 1. English
            "میں آپ سے محبت کرتی ہوں",     // 2. Urdu
            "زه له تا سره مینه لرم",       // 3. Pashto
            "أنا أحبك",                 // 4. Arabic
            "میں تہانوں پیار کردی آں",      // 5. Punjabi
            "Te amo",                    // 6. Spanish
            "Je t'aime",                 // 7. French
            "मैं आपसे प्यार करती हूँ",     // 8. Hindi
            "Eu te amo",                 // 9. Portuguese
            "Я тебя люблю",              // 10. Russian
            "Ik hou van je",             // 11. Dutch
            "Ich liebe dich",            // 12. German
            "ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ", // 13. Kannada
            "دوستت دارم",                // 14. Farsi
            "माझे तुझ्यावर प्रेम आहे",   // 15. Marathi
            "আমি তোমায় ভালোবাসি",        // 16. Bengali
            "Seni seviyorum",            // 17. Turkish
            "我爱你",                    // 18. Chinese
            "사랑해",                   // 19. Korean
            "אני אוהבת אותך"             // 20. Hebrew
        ];

        let animationTimeout;

        function startExperience() {
            const overlay = document.getElementById('overlay');
            const audio = document.getElementById('bg-song');

            // Hide overlay and start heart animation
            overlay.style.display = 'none';
            runHeartSequence();

            // Play background music safely
            audio.play().catch(error => {
                console.log("Audio playback error:", error);
            });
        }

        function runHeartSequence() {
            const container = document.getElementById('heart');
            container.innerHTML = ""; 
            
            const total = loveTranslations.length;
            const containerWidth = container.clientWidth || 500;
            // Balanced radius to ensure phrases have enough physical space without crashing into each other
            const radius = Math.min(containerWidth * 0.42, 240);

            const spanElements = loveTranslations.map((text, i) => {
                const span = document.createElement('span');
                span.className = 'message';
                span.innerText = text;

                // Mathematical heart parametric equations with proper distribution
                const t = (i / total) * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                const posX = (x / 16) * radius;
                const posY = (y / 16) * radius;

                span.style.left = `calc(50% + ${posX}px)`;
                span.style.top = `calc(50% + ${posY}px)`;

                // Balanced font sizing to prevent overflow and overlapping text boxes
                if (text.length > 18) {
                    span.style.fontSize = "11px";
                } else if (text.length > 10) {
                    span.style.fontSize = "13px";
                } else {
                    span.style.fontSize = "15px";
                }

                container.appendChild(span);
                return span;
            });

            let currentIndex = 0;

            function showNext() {
                if (currentIndex < spanElements.length) {
                    spanElements[currentIndex].classList.add('visible');
                    currentIndex++;
                    // 1.1 seconds pacing per line
                    animationTimeout = setTimeout(showNext, 1100); 
                } else {
                    // Hold full heart for 6 seconds before clearing and looping
                    animationTimeout = setTimeout(() => {
                        spanElements.forEach(span => span.classList.remove('visible'));
                        animationTimeout = setTimeout(runHeartSequence, 1200); 
                    }, 6000);
                }
            }

            showNext();
        }
    </script>
</body>
</html>
